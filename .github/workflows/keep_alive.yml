name: Render 24/7 Keep-Alive Pinger

on:
  schedule:
    # Runs every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl -s -f "https://vigil-backend-k511.onrender.com/api/health" || echo "Ping attempted"
